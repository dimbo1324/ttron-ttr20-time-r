services:
  ft12-emulator:
    build:
      context: .
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE: ft12-emulator
    command:
      - -log
      - ""
      - -listen
      - :9000
      - -grpc-listen
      - :9100
      - -mode
      - sum
      - -recent
      - "200"
    ports:
      - "9000:9000"
      - "9100:9100"
    healthcheck:
      test: ["CMD", "/app/ft12-healthcheck", "-tcp", "127.0.0.1:9100", "-timeout", "2s"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  ft12-gateway:
    build:
      context: .
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE: ft12-gateway
    command:
      - -log
      - ""
      - -target
      - ft12-emulator:9000
      - -grpc-listen
      - :9200
      - -mode
      - sum
      - -schedule
      - interval
      - -interval
      - 1s
      - -recent
      - "200"
    ports:
      - "9200:9200"
    depends_on:
      ft12-emulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/ft12-healthcheck", "-tcp", "127.0.0.1:9200", "-timeout", "2s"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  ft12-api:
    build:
      context: .
      dockerfile: deploy/docker/go-service.Dockerfile
      args:
        SERVICE: ft12-api
    command:
      - -log
      - ""
      - -http-listen
      - :8080
      - -emulator-grpc
      - ft12-emulator:9100
      - -gateway-grpc
      - ft12-gateway:9200
      - -cors-origin
      - ""
    ports:
      - "8080:8080"
    depends_on:
      ft12-emulator:
        condition: service_healthy
      ft12-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/ft12-healthcheck", "-url", "http://127.0.0.1:8080/api/v1/ready", "-timeout", "2s"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 5s
    restart: unless-stopped

  ft12-console:
    build:
      context: .
      dockerfile: deploy/docker/console.Dockerfile
    environment:
      # Read per request by the proxy route handler, not baked into the image:
      # see web/src/app/upstream.
      FT12_API_URL: http://ft12-api:8080
    ports:
      - "3000:3000"
    depends_on:
      ft12-api:
        condition: service_healthy
    healthcheck:
      # The same binary the Go services use. The runtime image is distroless
      # and has neither a shell nor curl, and one answer to "is this up" across
      # the stack beats three.
      test: ["CMD", "/app/ft12-healthcheck", "-url", "http://127.0.0.1:3000/ru", "-timeout", "3s"]
      interval: 10s
      timeout: 5s
      retries: 8
      # Next takes a moment to come up, and a container killed during that is a
      # restart loop that never resolves.
      start_period: 15s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles:
      - observability
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      ft12-api:
        condition: service_healthy
    restart: unless-stopped
