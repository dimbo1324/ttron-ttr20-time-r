name: CI

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        run: go run ./tools/checks format
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          # The version the app declares it needs, rather than one pinned here
          # that would drift away from it.
          node-version-file: web/package.json
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        # Frozen: CI installs what the lockfile says and fails if package.json
        # has moved on without it, rather than quietly resolving something the
        # author never ran.
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check architecture boundaries
        run: go run ./tools/checks architecture

  cleanup:
    name: Cleanup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cleanup dry-run
        run: go run ./tools/checks clean-runtime --dry-run

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check local Markdown links
        run: go run ./tools/checks doc-links

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config
      - name: Build images
        run: docker compose build
      - name: Smoke compose stack
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/ready >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/api/v1/ready
          curl -fsS http://127.0.0.1:8080/api/v1/overview
          curl -fsS http://127.0.0.1:8080/api/v1/events
          curl -fsS http://127.0.0.1:8080/api/v1/export/events.json
          curl -fsS http://127.0.0.1:8080/api/v1/export/events.csv
          curl -fsS http://127.0.0.1:8080/api/v1/export/overview.json
          curl -fsS http://127.0.0.1:8080/metrics
      - name: Compose logs
        if: always()
        run: docker compose logs
      - name: Compose down
        if: always()
        run: docker compose down -v

  race:
    name: Race Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race tests
        run: go test -race ./...
